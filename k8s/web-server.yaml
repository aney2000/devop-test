apiVersion: v1
kind: ConfigMap
metadata:
  name: web-html-config
  namespace: devops-test
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>DevOps Challenge</title>
        <style>
            body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
            h1 { color: #333; }
        </style>
    </head>
    <body>
        <h1>Hello World! Simple HTML page in Kubernetes!</h1>
    </body>
    </html>
---
apiVersion: v1
kind: Pod
metadata:
  name: static-web-server
  namespace: devops-test
  labels:
    app: my-static-web
spec:
  containers:
    - name: nginx-container
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html-volume
      configMap:
        name: web-html-config
